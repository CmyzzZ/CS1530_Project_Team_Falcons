name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Build (compile modules and load the app)
        run: |
          python -m compileall -q backend
          python -c "from backend.main import app; print('App loaded:', app.title)"

      - name: Run tests
        run: python -m pytest -v