services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: falcons
      POSTGRES_USER: falcons
      POSTGRES_PASSWORD: falcons_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - falcons_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcons -d falcons"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  falcons_pgdata: